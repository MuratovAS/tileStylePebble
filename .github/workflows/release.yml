name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run for an existing tag: pick the tag under "Use workflow from"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version from tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          # v1.2.3 or v1.2.3-beta.1; the watch shows major.minor, each 0..255
          if [[ "$GITHUB_REF" =~ ^refs/tags/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$ ]] \
              && (( BASH_REMATCH[2] <= 255 && BASH_REMATCH[3] <= 255 )); then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$GITHUB_REF is not a release tag like v1.2.3 (major and minor 0..255)"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tilestyle.pbw
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv tilestyle.pbw "tilestyle-$VERSION.pbw"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi # e.g. 1.1.0-beta.1
          gh release create "$GITHUB_REF_NAME" "tilestyle-$VERSION.pbw" \
            --repo "$GITHUB_REPOSITORY" --title "TileStyle $VERSION" \
            --generate-notes --verify-tag "${flags[@]}"
