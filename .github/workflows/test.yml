# Tests the settings page against the watchface on main: the test scripts live
# in main (tools/) and read this branch from config/, like the local worktree.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the watchface (main)
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Check out this commit into config/
        uses: actions/checkout@v7
        with:
          path: config
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: node tools/test_protocol.js
      - run: node tools/test_pkjs.js
